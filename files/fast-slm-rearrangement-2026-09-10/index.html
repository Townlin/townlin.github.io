<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast SLM Rearrangement — Jianshuo Gao</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#101925;overflow:hidden;font-family:system-ui,sans-serif}body{display:grid;place-items:center}#stage{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9;background:white}#slide{display:block;width:100%;height:100%;object-fit:contain}#clip{position:absolute;object-fit:fill;display:none}#play{position:absolute;display:none;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:6px}#play:hover,#play:focus-visible{outline:2px solid #2272b4;background:#2272b414}nav{position:fixed;bottom:5px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:6px 12px;border-radius:25px;background:#172b46e8;color:white;font-size:13px;opacity:0;transition:opacity .2s}body.controls nav,nav:focus-within{opacity:1}nav button{background:transparent;border:0;color:white;cursor:pointer;font-size:19px;padding:0 7px}#label{min-width:65px;text-align:center}#status{position:absolute;top:1%;right:1%;color:#fff;background:#16263ce8;border-radius:5px;padding:6px 10px;font-size:14px;display:none}
</style>
<div id="stage"><img id="slide" alt="Beamer presentation slide"><video id="clip" muted playsinline preload="metadata"></video><button id="play" aria-label="Play or pause the recorded camera video"></button><div id="status"></div></div>
<nav><button id="prev" aria-label="Previous slide">‹</button><span id="label"></span><button id="next" aria-label="Next slide">›</button><button id="toggle" aria-label="Play or pause video">▶</button><button id="full" aria-label="Fullscreen">⛶</button><span>← → &nbsp; Space &nbsp; F</span></nav>
<script>
const image=document.getElementById('slide'),video=document.getElementById('clip'),play=document.getElementById('play'),status=document.getElementById('status');
const movies={"6": {"file": "comparison_inline.mp4", "box": [2.5, 3.5, 27.24, 6.52], "hit": [1, 10.25, 8, 0.9]}, "7": {"file": "cnn_inline.mp4", "box": [19.4, 3.6, 11.4, 11.4], "hit": [19.4, 15.2, 11.4, 1]}, "8": {"file": "dirichlet_inline.mp4", "box": [19.4, 3.6, 11.4, 11.4], "hit": [19.4, 15.2, 11.4, 1]}, "11": {"file": "intensity_histograms.mp4", "box": [1, 3.4, 30, 11.2], "hit": [1, 14.9, 8, 1.1]}};
let page=Math.max(0,Math.min(14,parseInt(location.hash.slice(1))||0)),timer;
function rect(el,b){el.style.left=100*b[0]/32+'%';el.style.top=100*b[1]/18+'%';el.style.width=100*b[2]/32+'%';el.style.height=100*b[3]/18+'%';}
function show(n){page=Math.max(0,Math.min(14,n));video.pause();video.style.display='none';play.style.display='none';status.style.display='none';image.src='previews/slide-'+String(page+1).padStart(2,'0')+'.png';document.getElementById('label').textContent=page===0?'Cover':page+' / 14';history.replaceState(null,'','#'+page);if(movies[page]){const m=movies[page];video.src='media/'+m.file;video.style.objectFit='fill';rect(video,m.box);rect(play,m.hit);play.style.display='block';video.load();}else{video.removeAttribute('src');}document.getElementById('toggle').style.visibility=movies[page]?'visible':'hidden';}
async function toggle(){if(!movies[page])return;if(video.error){status.textContent='Video could not be loaded';status.style.display='block';setTimeout(()=>status.style.display='none',1600);return;}if(video.paused){if(video.ended)video.currentTime=0;video.style.display='block';try{await video.play();}catch(e){status.textContent='Open the MP4 in the media folder';status.style.display='block';}}else video.pause();}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();}
function controls(){document.body.classList.add('controls');clearTimeout(timer);timer=setTimeout(()=>document.body.classList.remove('controls'),1800);}
document.getElementById('prev').onclick=()=>show(page-1);document.getElementById('next').onclick=()=>show(page+1);document.getElementById('toggle').onclick=toggle;document.getElementById('full').onclick=fullscreen;play.onclick=toggle;video.onclick=toggle;video.onloadeddata=()=>{if(movies[page]){video.style.display='block';video.play().catch(()=>{});}};video.onerror=()=>{video.style.display='none';};document.addEventListener('mousemove',controls);document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown'].includes(e.code)){show(page+1);e.preventDefault();}else if(['ArrowLeft','PageUp'].includes(e.code)){show(page-1);e.preventDefault();}else if(e.code==='Space'){movies[page]?toggle():show(page+1);e.preventDefault();}else if(e.code==='KeyF'){fullscreen();e.preventDefault();}else if(e.code==='Home'){show(0);}else if(e.code==='End'){show(14);}});show(page);controls();
</script></html>
